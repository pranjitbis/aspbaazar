<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Title -->
    <title>AspBaazar | Fast & Fresh Online Food Delivery</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="AspBaazar offers fast, fresh, and reliable online food delivery. Order your favorite meals from top restaurants and get them delivered quickly to your doorstep."
    />

    <meta name="robots" content="index, follow" />
    <meta name="author" content="AspBaazar" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="AspBaazar | Online Food Delivery Service"
    />
    <meta
      property="og:description"
      content="Order delicious food online from top restaurants with AspBaazar. Fast delivery at your doorstep."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.aspbaazar.com" />
    <meta property="og:image" content="https://www.aspbaazar.com/Logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AspBaazar | Fast Online Food Delivery"
    />
    <meta
      name="twitter:description"
      content="Fresh meals delivered fast with AspBaazar."
    />
    <meta name="twitter:image" content="https://www.aspbaazar.com/Logo.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.aspbaazar.com" />

    <!-- Favicon -->
    <link rel="icon" href="/Logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
